[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Multi-user, citation-grounded retrieval-augmented generation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pypdf>=6.21.4",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "cryptography>=43",
    "sentence-transformers>=3.3",
    "torch>=2.15.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

# CPU-only PyTorch on every platform. The default PyPI wheel on Linux bundles CUDA (~2.5 GB),
# which the Docker image doesn't need for small embedding and reranking models.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "RET", "TID",
]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_platform"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: requires running Postgres, Redis and Qdrant (docker compose up -d)",
]

[tool.coverage.run]
source = ["rag_platform"]
branch = true
