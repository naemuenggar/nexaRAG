name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports: ["6333:6333"]
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://rag:ci-only-password@127.0.0.1:5432/rag
      REDIS_URL: redis://127.0.0.1:6379/0
      QDRANT_URL: http://127.0.0.1:6333
      # Throwaway value for CI only; real deployments inject secrets from a secret manager.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000000
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ hashFiles('src/rag_platform/core/config.py') }}
      - run: uv sync --frozen
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6333/readyz && exit 0; sleep 2; done
          exit 1
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head && uv run alembic check
      - name: Integration, authorization and retrieval regression tests
        run: uv run pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        env:
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x
          POSTGRES_DB: x
          QDRANT_API_KEY: x
          APP_IMAGE: example/app:ci
          DOMAIN: example.com
        run: |
          cp .env.example .env
          docker compose --profile app config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-rag-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
